name: Swift Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: iOS simulator tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme WatchMotionRecordingKit \
            -destination 'platform=iOS Simulator,name=iPhone 16'
